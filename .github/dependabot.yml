version: 2
updates:
  # Frontend (repo root) and push-service npm packages
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/push-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per week for all minor/patch bumps; majors get their own PRs
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # node:*-alpine base images in docker/Dockerfile.{frontend,push-service},
  # plus the node + HA base images in the addon Dockerfile. PB_VERSION there
  # is a plain ARG (not an image) and is bumped manually.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/ha-addon/calendhd"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # actions/* versions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
